name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # The Python practice harness (internal/testkit/py) runs under the
      # oldest interpreter the sandbox image ships.
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      # gofmt's rules are not negotiable in Go, so an unformatted file is a
      # build failure rather than a review comment.
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt'd:"
            echo "$unformatted"
            exit 1
          fi

      # Markdown and JSON get no gofmt, so a stray editor keystroke in the
      # hand-written premium statements is invisible in review and lands as a
      # spurious diff on someone else's clone.
      #
      # signature.txt is excluded on purpose: each one holds an indented blank
      # line inside an empty function body, which is where the cursor is meant
      # to land, and stripping it would change what `nc start` scaffolds.
      - name: trailing whitespace
        run: |
          offenders=$(git ls-files -z '*.md' '*.json' '*.yml' \
            | xargs -0 grep -nIl '[[:blank:]]$' || true)
          if [ -n "$offenders" ]; then
            echo "These tracked files have trailing whitespace:"
            echo "$offenders"
            exit 1
          fi

      # A stray import or a missing indirect requirement shows up here rather
      # than on the next person's `go build`.
      - name: go mod tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      # The set is in .golangci.yml. Pinned to the latest release because an
      # older binary cannot type-check a newer Go.
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: latest

      # Stdlib only, so the checks are the interpreter's own.
      - name: python harness
        run: |
          python3 -I -B -m compileall -q internal/testkit/py
          python3 -I -B -m unittest discover -s internal/testkit/py/tests -t internal/testkit/py

      # solutions/ is gitignored, so this runs the CLI and server tests only.
      # -count=1 keeps a flaky test from hiding behind the test cache.
      - name: go test
        run: go test -race -count=1 ./...
