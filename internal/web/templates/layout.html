<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{.Title}} — neetcode150</title>
<link rel="stylesheet" href="/static/app.css">
<link rel="stylesheet" href="/highlight.css">
<link rel="icon" href="/static/favicon.svg">
</head>
<body>
<header class="bar">
  <a class="brand" href="/">neetcode150</a>
  <nav class="nav">
    <a href="/" {{if eq .Nav "dashboard"}}class="on"{{end}}>Dashboard</a>
    <a href="/problems/" {{if eq .Nav "problems"}}class="on"{{end}}>Problems</a>
    <a href="/patterns/" {{if eq .Nav "patterns"}}class="on"{{end}}>Patterns</a>
    <a href="/review/" {{if eq .Nav "review"}}class="on"{{end}}>Review{{if .Due}} <span class="count">{{.Due}}</span>{{end}}</a>
  </nav>
  <span class="tally">{{.Summary.Done}}<span class="tally-sep">/</span>{{.Summary.Total}}</span>
</header>

<main class="main">
{{template "content" .}}
</main>

<script src="/static/app.js" defer></script>
</body>
</html>
